<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verbos">
<meta name="theme-color" content="#1a1d33">
<title>Verbos en inglés por patrones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Plan: tres pestañas (irregulares, regulares, phrasal verbs con up). Cada una abre con un mapa de familias y sigue con una tarjeta por patrón; el modo práctica oculta columnas. */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --ink:#1a1d33; --muted:#5d6280; --line:#dfe2ec;
  --c-aaa:#0f8a7e; --c-abb:#3b4cca; --c-aba:#b4630a; --c-abc:#c0306b; --c-reb:#4a4f63;
  --c-pre:#7a3fc4; --c-rar:#7d6a12;
  --hl-bg:rgba(255,196,0,.32); --hide:#e8eaf2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131f; --surface:#1a1d2d; --ink:#eceefa; --muted:#a2a7c4; --line:#2c3048;
    --c-aaa:#3cc7b8; --c-abb:#8b97ff; --c-aba:#f2a54a; --c-abc:#f2709f; --c-reb:#b3b8cc;
    --c-pre:#b98bff; --c-rar:#d8c25a; --hl-bg:rgba(255,196,0,.22); --hide:#262a40; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131f; --surface:#1a1d2d; --ink:#eceefa; --muted:#a2a7c4; --line:#2c3048;
  --c-aaa:#3cc7b8; --c-abb:#8b97ff; --c-aba:#f2a54a; --c-abc:#f2709f; --c-reb:#b3b8cc;
  --c-pre:#b98bff; --c-rar:#d8c25a; --hl-bg:rgba(255,196,0,.22); --hide:#262a40; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.02em}
.lede{max-width:65ch;color:var(--muted);margin:10px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.95rem}
.stat b{font-family:var(--f-display);font-size:1.25rem;margin-right:4px;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;margin-top:22px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs a{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--muted);padding:10px 16px;border-radius:10px 10px 0 0;margin-bottom:-2px;border:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:var(--line);border-bottom-color:var(--surface)}
.tabs a:hover{color:var(--ink)}
.tabs a:focus-visible{outline:3px solid var(--c-abb);outline-offset:2px}
.tabs a small{font-family:var(--f-mono);font-weight:500;font-size:.75rem;margin-left:6px;color:var(--muted)}

.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:24px 0 8px}
.fam{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fam.extra{border-style:dashed;border-top-style:solid}
.fam h2{font-size:1.05rem;color:var(--c)}
.fam .code{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;letter-spacing:.04em}
.fam p{margin:0;font-size:.9rem;color:var(--muted)}
.fam .chips{display:flex;flex-direction:column;gap:6px}
.fam button.chip{font:inherit;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:8px;color:var(--ink);font-size:.88rem;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.fam button.chip:hover,.fam button.chip:focus-visible{background:color-mix(in srgb,var(--c) 18%,transparent);outline:none}
.fam button.chip span:last-child{font-family:var(--f-mono);color:var(--muted);font-size:.8rem;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.optlbl{font-family:var(--f-mono);font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.rulebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rulebox h3{font-size:1rem;margin-bottom:8px}
.rulebox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rulebox li{display:flex;gap:10px;align-items:baseline;font-size:.92rem}
.rulebox li .badge{flex:none}
.rulebox p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}

.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:12px 0;margin:20px 0 8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.controls .lbl{font-weight:700;font-size:.9rem;color:var(--muted)}
#q{flex:1 1 220px;min-width:180px;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#q:focus-visible,button:focus-visible{outline:3px solid var(--c-abb);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--ink);padding:8px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.hint{font-size:.85rem;color:var(--muted);width:100%}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:16px}
.groups.wide{grid-template-columns:repeat(auto-fill,minmax(480px,1fr))}
.grp{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:90px}
.grp header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.grp h3{font-size:1.15rem}
.tag{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 8px;white-space:nowrap}
.formula{font-family:var(--f-mono);font-weight:700;font-size:1.02rem;color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:8px;padding:8px 10px}
.tip{margin:0;font-size:.92rem;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.98rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:6px;border-bottom:2px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.v{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
td.v.inf{font-weight:700}
td.es{color:var(--muted);font-size:.9rem}
td.ex{font-size:.92rem;font-style:italic}
td.ex b{font-style:normal;color:var(--c)}
mark{background:var(--hl-bg);color:inherit;border-radius:3px;padding:0 1px;font-weight:700}
small.alt{display:block;font-family:var(--f-body);color:var(--muted);font-size:.78rem;white-space:normal}
.badge{font-family:var(--f-mono);font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--hide);color:var(--ink);white-space:nowrap}
td.hidden{cursor:pointer;position:relative;background:repeating-linear-gradient(-45deg,var(--hide),var(--hide) 6px,transparent 6px,transparent 12px)}
td.hidden > *{visibility:hidden}
td.hidden::after{content:"ver";position:absolute;left:8px;top:6px;font-family:var(--f-body);font-size:.75rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{color:var(--muted);padding:20px 0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin-top:24px;max-width:80ch}
.note h3{font-size:1.05rem;margin-bottom:6px}
.note p{margin:6px 0;color:var(--muted)}
.note code{font-family:var(--f-mono);font-size:.9em;color:var(--ink)}
.map.five{grid-template-columns:repeat(5,1fr)}
.map.two{grid-template-columns:repeat(2,1fr);margin-top:0}
.map.two .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
@media (max-width:980px){.map.five{grid-template-columns:repeat(2,1fr)}.map.two{grid-template-columns:1fr}}
@media (max-width:520px){.map.five{grid-template-columns:1fr}}
/* Tarjetas */
.fc{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:20px;align-items:start}
.fc-side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:1rem}
.panel label{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.panel select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.boxes div{border-radius:8px;padding:6px 2px;background:var(--hide)}
.boxes b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.boxes span{font-size:.72rem;color:var(--muted)}
.card-wrap{perspective:1400px}
.card{position:relative;width:100%;min-height:340px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .45s ease;font:inherit;color:inherit;display:block}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);border-top:8px solid var(--c);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .kind{font-family:var(--f-mono);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.face .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05}
.face .mid{font-family:var(--f-mono);font-weight:700;font-size:clamp(1.3rem,4vw,1.9rem)}
.face .es{font-size:1.15rem;color:var(--muted)}
.face .ex{font-style:italic;font-size:1.05rem;max-width:40ch}
.face .tap{font-size:.85rem;color:var(--muted)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.answer button{font:inherit;font-weight:700;font-size:1.05rem;padding:16px;border-radius:14px;cursor:pointer;border:2px solid}
.answer .no{background:color-mix(in srgb,var(--c-abc) 12%,transparent);border-color:var(--c-abc);color:var(--ink)}
.answer .yes{background:color-mix(in srgb,var(--c-aaa) 12%,transparent);border-color:var(--c-aaa);color:var(--ink)}
.answer button:disabled{opacity:.4;cursor:not-allowed}
.small-btn{font:inherit;font-size:.88rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
@media (max-width:820px){.fc{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.card{transition:none}}

/* Reto del día */
.reto{max-width:720px;margin:20px auto 0;display:flex;flex-direction:column;gap:16px}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.streak{display:flex;align-items:center;gap:16px}
.streak svg{flex:none}
.streak b{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.streak p{margin:0;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted)}
.week i{display:block;width:30px;height:30px;border-radius:50%;background:var(--hide);border:2px solid transparent}
.week i.ok{background:var(--c-aba);border-color:var(--c-aba)}
.week i.today{border-color:var(--ink)}
.big-btn{font:inherit;font-weight:800;font-size:1.15rem;padding:16px 20px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.big-btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.prog{height:12px;border-radius:6px;background:var(--hide);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c-aaa);transition:width .3s}
.qkind{font-family:var(--f-mono);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:clamp(1.4rem,4vw,2rem);font-weight:700;line-height:1.2;margin:0}
.qtext em{font-style:normal;color:var(--c-abb)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{font:inherit;font-size:1.1rem;font-family:var(--f-mono);font-weight:700;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opts button.es{font-family:var(--f-body);font-weight:600}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--c-aaa);background:color-mix(in srgb,var(--c-aaa) 14%,transparent)}
.opts button.wrong{border-color:var(--c-abc);background:color-mix(in srgb,var(--c-abc) 14%,transparent)}
.typein{display:flex;gap:10px;flex-wrap:wrap}
.typein input{flex:1 1 220px;font:inherit;font-family:var(--f-mono);font-size:1.2rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.typein button{font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.fb{border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:color-mix(in srgb,var(--c-aaa) 16%,transparent)}
.fb.bad{background:color-mix(in srgb,var(--c-abc) 16%,transparent)}
.fb p{margin:0;font-weight:600}
.fb button{font:inherit;font-weight:800;padding:12px 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.miss{margin:0;padding-left:18px;color:var(--muted)}
.miss b{color:var(--ink);font-family:var(--f-mono)}
@media (max-width:560px){.opts{grid-template-columns:1fr}}

@media (max-width:560px){.groups,.groups.wide{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1>Verbos en inglés por patrones</h1><a href="tiempos.html" style="font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px">Tiempos verbales →</a></div>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <div id="intro"></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Buscar en inglés o en español…" aria-label="Buscar">
    <span class="lbl" id="practLbl">Practicar:</span>
    <div class="seg" role="group" aria-labelledby="practLbl" id="modes"></div>
    <span class="hint">En modo práctica, toca una celda rayada para comprobar tu respuesta.</span>
  </div>
  <div class="groups" id="groups"></div>
  <div id="outro"></div>
</div>

<script>
const FAM = {
  aaa:{name:"Las tres iguales", code:"A·A·A", desc:"No cambian nunca. Casi todos son cortos y acaban en -t o -d.", c:"--c-aaa"},
  abb:{name:"Pasado = participio", code:"A·B·B", desc:"Aprendes una sola forma nueva y la usas dos veces.", c:"--c-abb"},
  aba:{name:"Participio = infinitivo", code:"A·B·A", desc:"Solo cambia el pasado.", c:"--c-aba"},
  abc:{name:"Las tres distintas", code:"A·B·C", desc:"Tres formas, pero con fórmulas que se repiten.", c:"--c-abc"},
  reb:{name:"Los rebeldes", code:"?·?·?", desc:"Sin patrón: memorízalos aparte. Son pocos y muy usados.", c:"--c-reb"},
  pre:{name:"Con prefijo", code:"pre+A", desc:"Opcional. Se conjugan igual que el verbo base.", c:"--c-pre", extra:true},
  rar:{name:"Raros y literarios", code:"★", desc:"Opcional. Casi solo en libros antiguos, la Biblia o fantasía.", c:"--c-rar", extra:true}
};

// [infinitivo, pasado, participio, español, nota opcional]
const G = [
 {id:"tres-iguales", fam:"aaa", t:"Las tres iguales", f:"cut → cut → cut", tip:"Truco: si el verbo es de una sílaba y acaba en -t o -d, sospecha que no cambia.", v:[
  ["bet","bet","bet","apostar"],["bid","bid","bid","pujar, ofertar"],["broadcast","broadcast","broadcast","transmitir"],["burst","burst","burst","reventar"],["bust","bust","bust","romper, arrestar","también busted"],["cast","cast","cast","lanzar, dar un papel"],["cost","cost","cost","costar"],["cut","cut","cut","cortar"],["fit","fit","fit","quedar bien, encajar","también fitted (UK)"],["forecast","forecast","forecast","pronosticar"],["hit","hit","hit","golpear"],["hurt","hurt","hurt","herir, doler"],["input","input","input","introducir (datos)"],["knit","knit","knit","tejer","también knitted"],["let","let","let","dejar, permitir"],["offset","offset","offset","compensar"],["outbid","outbid","outbid","superar una oferta"],["put","put","put","poner"],["quit","quit","quit","dejar, renunciar"],["read","read","read","leer","pasado y participio suenan /red/"],["reset","reset","reset","restablecer"],["rid","rid","rid","librar(se) de"],["set","set","set","colocar, fijar"],["shed","shed","shed","desprender, soltar"],["shut","shut","shut","cerrar"],["slit","slit","slit","rajar"],["split","split","split","dividir"],["spread","spread","spread","extender, untar"],["sublet","sublet","sublet","subarrendar"],["thrust","thrust","thrust","empujar con fuerza"],["upset","upset","upset","molestar, alterar"],["wed","wed","wed","casarse","también wedded"],["wet","wet","wet","mojar","también wetted"]
 ]},
 {id:"ought", fam:"abb", t:"Los de -ought / -aught", f:"think → thought → thought", tip:"Todos suenan /ɔːt/ al final. Con a solo catch y teach.", v:[
  ["bring","brought","brought","traer"],["buy","bought","bought","comprar"],["fight","fought","fought","pelear"],["seek","sought","sought","buscar"],["think","thought","thought","pensar"],["catch","caught","caught","atrapar"],["teach","taught","taught","enseñar"]
 ]},
 {id:"eep-ept", fam:"abb", t:"-eep se vuelve -ept", f:"keep → kept → kept", tip:"La ee larga se acorta a e y se añade -t.", v:[
  ["keep","kept","kept","guardar, mantener"],["sleep","slept","slept","dormir"],["sweep","swept","swept","barrer"],["weep","wept","wept","llorar"],["creep","crept","crept","arrastrarse"],["leap","leapt","leapt","saltar","también leaped"]

function regPast(raw){
  if (raw.includes(">")) { const [i,p]=raw.split(">"); return {inf:i, past:p, rule:"ck"}; }
  if (raw.endsWith("*")) { const i=raw.slice(0,-1); return {inf:i, past:i+i.slice(-1)+"ed", rule:"dbl"}; }
  const i=raw;
  if (i.endsWith("e")) return {inf:i, past:i+"d", rule:"e"};
  if (/[^aeiou]y$/.test(i)) return {inf:i, past:i.slice(0,-1)+"ied", rule:"y"};
  return {inf:i, past:i+"ed", rule:"ed"};
}
const RULES = {
  ed:{lbl:"+ed", txt:"La regla general: se añade -ed.", ex:"work → worked"},
  e:{lbl:"+d", txt:"Si termina en -e, solo se añade -d.", ex:"live → lived"},
  y:{lbl:"y→ied", txt:"Consonante + y: la y cambia a -ied. Con vocal + y no cambia (play → played).", ex:"study → studied"},
  dbl:{lbl:"doble", txt:"Una vocal + una consonante en sílaba fuerte: se dobla la consonante.", ex:"stop → stopped"},
  ck:{lbl:"+ked", txt:"Terminados en -c: se añade -ked.", ex:"panic → panicked"}
};

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function diff(base, form){
  if (form.includes(" / ")) return form.split(" / ").map(x=>diff(base,x)).join(" / ");
  if (base===form) return esc(form);
  let p=0; while(p<base.length && p<form.length && base[p]===form[p]) p++;
  let s=0; while(s<base.length-p && s<form.length-p && base[base.length-1-s]===form[form.length-1-s]) s++;
  return esc(form.slice(0,p))+"<mark>"+esc(form.slice(p,form.length-s))+"</mark>"+esc(form.slice(form.length-s));
}
function cell(cls, hidden, inner){return `<td class="${cls}${hidden?" hidden":""}"><span>${inner}</span></td>`}
function famCard(f, chips, extra){
  return `<section class="fam${extra?" extra":""}" style="--c:var(${f.c})">
    ${extra?`<span class="optlbl">Opcional</span>`:""}
    <h2>${f.name}</h2><div class="code"${f.code.length>9?' style="font-size:1.05rem"':""}>${f.code}</div>
    <div class="bar"><i style="width:${f.pct}%"></i></div>
    <p>${f.desc}</p>
    <div class="chips">${chips.map(c=>`<button type="button" class="chip" data-go="${c.id}"><span>${esc(c.t)}</span><span>${c.n}</span></button>`).join("")}</div>
  </section>`;
}

  document.getElementById("intro").innerHTML=V.intro();

  document.getElementById("modes").innerHTML=V.modes.map(([m,l],i)=>`<button type="button" data-mode="${m}" aria-pressed="${i===0}">${l}</button>`).join("");
  document.getElementById("groups").className="groups"+(V.wide?" wide":"");
  document.querySelector(".controls").style.display = V.custom ? "none" : "";
  document.getElementById("groups").style.display = V.custom ? "none" : "";
  if (V.custom) { V.init(); return; }
  render();
}

  const out=VIEWS[view].groups(norm(query.trim()), mode).filter(Boolean);

}

  const b=e.target.closest("#modes button"); if(b){
    mode=b.dataset.mode;

function deckCards(d){
  if(d==="irr"||d==="irrx") return G.filter(g=>!!FAM[g.fam].extra===(d==="irrx")).flatMap(g=>g.v.map(([i,p,pp,es,n])=>({id:d+":"+i, c:FAM[g.fam].c, kind:g.t, front:i, mid:`${p} · ${pp}`, es, note:n||"", ex:""})));
  if(d==="reg") return REG.flatMap(s=>s.items.map(v=>({id:"reg:"+v.inf, c:s.c, kind:"Regular · la -ed suena "+s.snd, front:v.inf, mid:v.past, es:v.es, note:"", ex:""})));
  return UP.flatMap(g=>g.v.map(([pv,es,ex])=>({id:"up:"+pv+":"+es, c:g.c, kind:g.t, front:pv, mid:"", es, note:"", ex})));
}
function fcPick(){
  const cards=deckCards(FC.deck);
  const pool=cards.length>1?cards.filter(c=>c.id!==FC.last):cards;
  let tot=pool.reduce((n,c)=>n+BOXW[FC.mem[c.id]||0],0), r=Math.random()*tot;
  for(const c of pool){ r-=BOXW[FC.mem[c.id]||0]; if(r<=0) return c; }
  return pool[pool.length-1];
}
function fcShow(){
  const c=FC.cur=fcPick(); FC.flipped=false;
  const card=document.getElementById("fcCard"); card.classList.remove("flipped"); card.style.setProperty("--c",`var(${c.c})`);
  const front = FC.rev
    ? `<span class="kind">${esc(c.kind)}</span><span class="big" style="font-size:clamp(1.6rem,5vw,2.6rem)">${esc(c.es)}</span><span class="tap">¿Cómo se dice en inglés? Toca para ver.</span>`
    : `<span class="kind">${esc(c.kind)}</span><span class="big">${esc(c.front)}</span><span class="tap">${c.mid?"¿Pasado y participio? ":"¿Qué significa? "}Toca para ver.</span>`;
  const back = `<span class="kind">${esc(c.kind)}</span><span class="big" style="font-size:clamp(1.8rem,5vw,2.8rem)">${esc(c.front)}</span>${c.mid?`<span class="mid">${esc(c.mid)}</span>`:""}<span class="es">${esc(c.es)}</span>${c.ex?`<span class="ex">${esc(c.ex)}</span>`:""}${c.note?`<span class="tap">${esc(c.note)}</span>`:""}`;
  card.innerHTML=`<span class="face front">${front}</span><span class="face back">${back}</span>`;
  card.setAttribute("aria-label","Tarjeta. Toca para voltear.");
  document.getElementById("fcYes").disabled=true; document.getElementById("fcNo").disabled=true;
  fcStats();
}
function fcFlip(){
  FC.flipped=!FC.flipped; document.getElementById("fcCard").classList.toggle("flipped",FC.flipped);
  if(FC.flipped){ document.getElementById("fcYes").disabled=false; document.getElementById("fcNo").disabled=false; }
}
function fcAnswer(ok){
  if(!FC.flipped) return;
  const b=FC.mem[FC.cur.id]||0; FC.mem[FC.cur.id]= ok ? Math.min(5,b+1) : 1; save(FC.mem);
  FC.last=FC.cur.id; fcShow();
}
function fcStats(){
  const cards=deckCards(FC.deck), cnt=[0,0,0,0];
  cards.forEach(c=>{ const b=FC.mem[c.id]||0; cnt[b===0?0:b<=2?1:b<=4?2:3]++; });
  document.getElementById("fcBoxes").innerHTML=[["Nuevas",cnt[0]],["Aprendiendo",cnt[1]],["Repasando",cnt[2]],["Dominadas",cnt[3]]].map(([l,n])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");
}
function fcResetUI(confirming){
  document.getElementById("fcReset").innerHTML = confirming
    ? `<div class="confirm">¿Borrar el progreso de este mazo? <button type="button" class="small-btn" id="fcResetYes">Sí, borrar</button><button type="button" class="small-btn" id="fcResetNo">Cancelar</button></div>`
    : `<button type="button" class="small-btn" id="fcResetBtn">Empezar este mazo de cero</button>`;
}
function fcInit(){
  FC.mem=store(); FC.last=null;
  document.getElementById("fcDeck").value=FC.deck; document.getElementById("fcRev").checked=FC.rev;
  fcShow();
}
document.addEventListener("click",e=>{
  if(e.target.closest("#fcCard")) return fcFlip();
  if(e.target.closest("#fcYes")) return fcAnswer(true);
  if(e.target.closest("#fcNo")) return fcAnswer(false);
  if(e.target.closest("#fcResetBtn")) return fcResetUI(true);
  if(e.target.closest("#fcResetNo")) return fcResetUI(false);
  if(e.target.closest("#fcResetYes")){ deckCards(FC.deck).forEach(c=>delete FC.mem[c.id]); save(FC.mem); fcResetUI(false); fcShow(); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="fcDeck"){ FC.deck=e.target.value; FC.last=null; fcShow(); }
  if(e.target.id==="fcRev"){ FC.rev=e.target.checked; fcShow(); }
});

// ---------- Reto del día ----------
const RETO_N = 10;
function rload(){ try{ return JSON.parse(localStorage.getItem("verbos-reto")||"{}"); }catch(e){ return {}; } }
function rsave(s){ try{ localStorage.setItem("verbos-reto", JSON.stringify(s)); }catch(e){} }
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return dkey(new Date()); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return dkey(d); }
function curStreak(s){ // la racha sigue viva si el último día hecho fue hoy o ayer
  return (s.last===today()||s.last===daysAgo(1)) ? (s.streak||0) : 0;
}
const FLAME = `<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="var(--c-aba)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-3 2-5 5-5 8 0 4 3 7 7 7z" fill="color-mix(in srgb, var(--c-aba) 25%, transparent)"/></svg>`;

function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function weighted(list, idf){
  const mem=store(); let tot=list.reduce((n,x)=>n+BOXW[mem[idf(x)]||0],0), r=Math.random()*tot;
  for(const x of list){ r-=BOXW[mem[idf(x)]||0]; if(r<=0) return x; } return list[list.length-1];
}
const IRR = G.filter(g=>!FAM[g.fam].extra).flatMap(g=>g.v.map(v=>({i:v[0],p:v[1],pp:v[2],es:v[3],n:v[4]||""})));
const REGI = REG.flatMap(s=>s.items.map(v=>({...v,snd:s.snd})));
const UPI = UP.flatMap(g=>g.v.map(v=>({pv:v[0],es:v[1],ex:v[2]})));
function regularize(i){ return i.endsWith("e")?i+"d":/[^aeiou]y$/.test(i)?i.slice(0,-1)+"ied":i+"ed"; }
function accepted(main, note){
  const set=new Set(main.split(" / ").map(s=>s.trim().toLowerCase()));
  (note.match(/(?:también|US:|UK:)\s*([a-z-]+)/gi)||[]).forEach(m=>set.add(m.split(/\s+/).pop().toLowerCase()));
  return set;
}
function fillOpts(correct, pool){
  const out=[correct]; for(const x of shuffle(pool)){ if(out.length>=4) break; if(!out.includes(x)) out.push(x); }
  return shuffle(out);
}
const QMAKERS = {
  past(){ const v=weighted(IRR,x=>"irr:"+x.i);
    const out=[v.p]; [regularize(v.i), v.pp, v.i, ...shuffle(IRR).map(x=>x.p)].forEach(x=>{ if(out.length<4 && !out.includes(x)) out.push(x); });
    return {id:"irr:"+v.i, kind:"Irregulares · pasado", q:`¿Cuál es el pasado de <em>${esc(v.i)}</em>?`, opts:shuffle(out), ans:v.p, show:`${v.i} – ${v.p} – ${v.pp}`}; },
  pp(){ const v=weighted(IRR,x=>"irr:"+x.i);
    return {id:"irr:"+v.i, kind:"Irregulares · participio", q:`Escribe el participio de <em>${esc(v.i)}</em> <span style="font-weight:400;color:var(--muted)">(${esc(v.es)})</span>`, type:true, ok:accepted(v.pp,v.n), ans:v.pp, show:`${v.i} – ${v.p} – ${v.pp}`}; },
  rev(){ const v=weighted(IRR,x=>"irr:"+x.i);
    return {id:"irr:"+v.i, kind:"Vocabulario", q:`¿Cómo se dice <em>${esc(v.es)}</em> en inglés?`, opts:fillOpts(v.i, IRR.map(x=>x.i)), ans:v.i, show:`${v.i} = ${v.es}`}; },
  up(){ const v=weighted(UPI,x=>"up:"+x.pv+":"+x.es);
    return {id:"up:"+v.pv+":"+v.es, kind:"Phrasal verbs con up", q:`¿Qué significa <em>${esc(v.pv)}</em>?<br><span style="font-size:1rem;font-weight:400;font-style:italic;color:var(--muted)">${esc(v.ex)}</span>`, opts:fillOpts(v.es, UPI.filter(x=>x.pv!==v.pv).map(x=>x.es)), es:true, ans:v.es, show:`${v.pv} = ${v.es}`}; },
  snd(){ const v=weighted(REGI,x=>"reg:"+x.inf);
    return {id:"reg:"+v.inf, kind:"Regulares · pronunciación", q:`¿Cómo suena la -ed en <em>${esc(v.past)}</em>?`, opts:["/t/","/d/","/ɪd/"], ans:v.snd, show:`${v.past} suena con ${v.snd}`}; }
};
let R=null;
function retoHome(){
  const s=rload(), st=curStreak(s), done=s.last===today();
  const days=["D","L","M","M","J","V","S"];
  const week=[6,5,4,3,2,1,0].map(n=>{ const k=daysAgo(n), d=new Date(); d.setDate(d.getDate()-n);
    return `<div><i class="${(s.days||{})[k]!==undefined?"ok":""}${n===0?" today":""}"></i>${days[d.getDay()]}</div>`; }).join("");
  document.getElementById("reto").innerHTML=`
    <div class="rbox"><div class="streak">${FLAME}<div><b>${st}</b><p>${st===1?"día seguido":"días seguidos"} · récord: ${s.best||0}</p></div></div>
      <div class="week">${week}</div>
      <p style="margin:0;color:var(--muted)">${done?`Hoy ya hiciste tu reto (${s.days[today()]}/${RETO_N}). Vuelve mañana para seguir la racha.`:(st>0?"Haz el reto de hoy para no perder tu racha.":"Haz tu primer reto y empieza una racha.")}</p>
      <button type="button" class="big-btn${done?" alt":""}" id="rStart">${done?"Otra ronda para practicar":`Empezar el reto de hoy (${RETO_N} preguntas)`}</button>
    </div>`;
}
function retoStart(){
  const plan=shuffle(["past","past","past","pp","pp","rev","up","up","snd","snd"]);
  const qs=[]; const seen=new Set();
  for(const t of plan){ let q, tries=0; do{ q=QMAKERS[t](); tries++; }while(seen.has(q.id+t) && tries<8); seen.add(q.id+t); qs.push(q); }
  R={qs, i:0, right:0, miss:[], answered:false};
  retoQ();
}
function retoQ(){
  const q=R.qs[R.i]; R.answered=false;
  const body = q.type
    ? `<form class="typein" id="rForm" autocomplete="off"><label for="rIn" class="sr">Tu respuesta</label><input id="rIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe aquí"><button type="submit">Comprobar</button></form>`
    : `<div class="opts">${q.opts.map(o=>`<button type="button" class="${q.es?"es":""}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  document.getElementById("reto").innerHTML=`
    <div class="prog" aria-label="Pregunta ${R.i+1} de ${RETO_N}"><i style="width:${R.i/RETO_N*100}%"></i></div>
    <div class="rbox"><span class="qkind">${esc(q.kind)} · ${R.i+1}/${RETO_N}</span><p class="qtext">${q.q}</p>${body}<div id="rFb"></div></div>`;
  const inp=document.getElementById("rIn"); if(inp) inp.focus();
}
function retoCheck(given, btn){
  if(R.answered) return; R.answered=true;
  const q=R.qs[R.i];
  const ok = q.type ? q.ok.has(given.trim().toLowerCase()) : given===q.ans;
  const mem=store(); const b=mem[q.id]||0; mem[q.id]= ok?Math.min(5,b+1):1; save(mem);
  if(ok) R.right++; else R.miss.push(q.show);
  document.querySelectorAll(".opts button").forEach(x=>{ x.disabled=true; if(x.dataset.opt===q.ans) x.classList.add("right"); });
  if(btn && !ok) btn.classList.add("wrong");
  const inp=document.getElementById("rIn"); if(inp) inp.disabled=true;
  document.getElementById("rFb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><p>${ok?"¡Correcto!":"Era: "+esc(q.show)}</p><button type="button" id="rNext">${R.i+1<RETO_N?"Continuar":"Ver resultado"}</button></div>`;
  document.getElementById("rNext").focus();
}
function retoEnd(){
  const s=rload(); const t=today();
  if(s.last!==t){ s.streak = (s.last===daysAgo(1)) ? (s.streak||0)+1 : 1; s.last=t; }
  s.days=s.days||{}; s.days[t]=Math.max(s.days[t]||0, R.right); s.best=Math.max(s.best||0, s.streak);
  rsave(s);
  const msg = R.right===RETO_N?"¡Perfecto!":R.right>=7?"¡Muy bien!":R.right>=4?"Vas bien, sigue así.":"Mañana te irá mejor: las que fallaste vuelven pronto.";
  document.getElementById("reto").innerHTML=`
    <div class="prog"><i style="width:100%"></i></div>
    <div class="rbox"><span class="score">${R.right}/${RETO_N}</span><p style="margin:0;font-size:1.15rem;font-weight:700">${msg}</p>
      <div class="streak">${FLAME}<div><b>${s.streak}</b><p>${s.streak===1?"día seguido":"días seguidos"}</p></div></div>
      ${R.miss.length?`<div><p style="margin:0 0 6px;font-weight:700">Para repasar:</p><ul class="miss">${R.miss.map(m=>`<li><b>${esc(m)}</b></li>`).join("")}</ul></div>`:""}
      <button type="button" class="big-btn alt" id="rHome">Volver</button></div>`;
}
document.addEventListener("click",e=>{
  if(e.target.closest("#rStart")) return retoStart();
  const o=e.target.closest("[data-opt]"); if(o && R) return retoCheck(o.dataset.opt, o);
  if(e.target.closest("#rNext")){ R.i++; return R.i<RETO_N ? retoQ() : retoEnd(); }
  if(e.target.closest("#rHome")) return retoHome();
});
document.addEventListener("submit",e=>{ if(e.target.id==="rForm"){ e.preventDefault(); retoCheck(document.getElementById("rIn").value); } });
window.addEventListener("hashchange",()=>setView(location.hash.slice(1)));
setView(location.hash.slice(1));
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
